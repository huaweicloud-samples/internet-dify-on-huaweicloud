apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-web
  namespace: dify
  labels:
    app: dify-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-web
  template:
    metadata:
      labels:
        app: dify-web
    spec:
      containers:
        - name: web
          image: langgenius/dify-web:1.13.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Web 通过控制台/应用地址拼接前端请求，地址在 apply 前填为 ELB 公网入口
            - name: CONSOLE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: dify-env
                  key: CONSOLE_API_URL
            - name: APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: dify-env
                  key: APP_API_URL
            - name: NEXT_PUBLIC_API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: dify-env
                  key: NEXT_PUBLIC_API_PREFIX
            - name: NEXT_PUBLIC_PUBLIC_API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: dify-env
                  key: NEXT_PUBLIC_PUBLIC_API_PREFIX
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DEBUG
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dify-web
  namespace: dify
spec:
  selector:
    app: dify-web
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 31000
  type: NodePort
