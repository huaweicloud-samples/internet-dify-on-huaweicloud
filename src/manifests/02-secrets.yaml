# Dify 敏感凭据（占位符，部署前请通过 kubectl 替换为真实值，严禁提交真实凭据）
# 示例替换命令：
#   kubectl -n dify create secret generic dify-secrets \
#     --from-literal=DB_PASSWORD='<你的 RDS 密码>' \
#     --from-literal=REDIS_PASSWORD='<你的 DCS 密码>' \
#     --from-literal=S3_ACCESS_KEY='<你的 OBS AK>' \
#     --from-literal=S3_SECRET_KEY='<你的 OBS SK>' \
#     --from-literal=SECRET_KEY='<一段随机字符串>' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: dify-secrets
  namespace: dify
type: Opaque
stringData:
  DB_USERNAME: "root"
  DB_PASSWORD: "<请替换为 RDS PostgreSQL 密码>"
  PGVECTOR_USER: "root"
  PGVECTOR_PASSWORD: "<请替换为 RDS PostgreSQL 密码>"
  REDIS_PASSWORD: "<请替换为 DCS Redis 密码>"
  S3_ACCESS_KEY: "<请替换为 OBS 访问密钥 AK>"
  S3_SECRET_KEY: "<请替换为 OBS 访问密钥 SK>"
  SECRET_KEY: "<请替换为随机字符串，例如 openssl rand -base64 42>"
  DIFY_INNER_API_KEY: "<请替换为 api 与 sandbox 共享的随机字符串>"
  PLUGIN_DAEMON_KEY: "<请替换为 api 与 plugin-daemon 共享的随机字符串>"
